<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VK Authorization</title>
</head>
<body>

<h2>Authorization successful</h2>

<p>Copy the values below to your local PC.</p>

<p><b>Code:</b></p>
<pre id="code"></pre>

<p><b>Device ID:</b></p>
<pre id="device_id"></pre>

<p><b>State:</b></p>
<pre id="state"></pre>

<script>
const params = new URLSearchParams(window.location.search);

document.getElementById("code").textContent =
    params.get("code") || "NOT FOUND";

document.getElementById("device_id").textContent =
    params.get("device_id") || "NOT FOUND";

document.getElementById("state").textContent =
    params.get("state") || "NOT FOUND";
</script>

</body>
</html>
